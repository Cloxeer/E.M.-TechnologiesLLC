<style>
:root {
  --terra: #B85C2A;
  --terra-light: #D4875A;
  --terra-dark: #8A4420;
  --obsidian: #1A1A18;
  --obsidian-mid: #2A2A28;
  --obsidian-light: #3A3A38;
  --cream: #FAF8F3;
  --cream-dark: #F0EDE5;
  --sand: #C4B69C;
  --sand-light: #D9CEB8;
  --stone: #7A7A72;
  --white: #FFFFFF;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--obsidian);
  overflow-x: hidden;
  line-height: 1.6;
}

/* ============ NAVIGATION ============ */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 60px;
  background: rgba(26,26,24,0.96);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(184,92,42,0.15);
  transition: all 0.4s ease;
}

nav.scrolled { padding: 14px 60px; }

.nav-brand {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--cream);
  text-decoration: none;
  letter-spacing: -0.02em;
}

.nav-brand span { color: var(--terra); }

.nav-links {
  display: flex;
  list-style: none;
  gap: 32px;
  align-items: center;
}

.nav-links a {
  text-decoration: none;
  color: var(--sand);
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: color 0.3s ease;
  position: relative;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -4px; left: 0;
  width: 0; height: 2px;
  background: var(--terra);
  transition: width 0.3s ease;
}

.nav-links a:hover { color: var(--cream); }
.nav-links a:hover::after { width: 100%; }

.nav-cta {
  background: var(--terra) !important;
  color: var(--cream) !important;
  padding: 10px 24px;
  border-radius: 6px;
  font-weight: 700 !important;
  letter-spacing: 0.04em !important;
  transition: background 0.3s ease, transform 0.2s ease !important;
}

.nav-cta:hover {
  background: var(--terra-dark) !important;
  transform: translateY(-1px);
}

.nav-cta::after { display: none !important; }

.nav-toggle {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px;
}

.nav-toggle span {
  width: 24px; height: 2px;
  background: var(--cream);
  transition: all 0.3s ease;
}

/* ============ PAGE HERO ============ */
.page-hero {
  padding: 160px 60px 90px;
  background: var(--obsidian);
  position: relative;
  overflow: hidden;
}

.page-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(184,92,42,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(184,92,42,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

.page-hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(184,92,42,0.4), transparent);
}

.page-hero-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--terra);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
}

.page-hero-label::before {
  content: '';
  width: 24px; height: 2px;
  background: var(--terra);
}

.page-hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.4rem, 5vw, 4rem);
  font-weight: 900;
  color: var(--cream);
  line-height: 1.1;
  letter-spacing: -0.02em;
  max-width: 700px;
  position: relative;
}

.page-hero p {
  font-size: 1.1rem;
  color: var(--stone);
  max-width: 560px;
  line-height: 1.7;
  font-weight: 300;
  margin-top: 20px;
  position: relative;
}

/* ============ SECTION STYLES ============ */
section {
  padding: 100px 60px;
  position: relative;
}

.section-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  color: var(--terra);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.section-label::before {
  content: '';
  width: 24px; height: 2px;
  background: var(--terra);
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 3.5vw, 2.6rem);
  font-weight: 900;
  margin-bottom: 16px;
  letter-spacing: -0.02em;
}

/* ============ TOPICS ============ */
.topics-section {
  background: var(--cream);
  border-bottom: 1px solid rgba(184,92,42,0.1);
}

.topics-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  margin-top: 48px;
}

.topic-card {
  background: var(--cream-dark);
  padding: 48px 36px;
  position: relative;
  transition: all 0.3s ease;
}

.topic-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: var(--terra);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
}

.topic-card:hover::before { transform: scaleX(1); }
.topic-card:hover { background: var(--white); }

.topic-number {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--terra);
  letter-spacing: 0.12em;
  margin-bottom: 20px;
}

.topic-card h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 12px;
  line-height: 1.3;
}

.topic-card p {
  font-size: 0.9rem;
  color: var(--stone);
  line-height: 1.65;
  font-weight: 300;
}

/* ============ WHAT TO EXPECT ============ */
.expect-section {
  background: var(--cream-dark);
  border-top: 1px solid rgba(184,92,42,0.1);
}

.expect-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: start;
}

.expect-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-top: 8px;
}

.expect-list li {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  padding: 24px;
  background: var(--cream);
  border-radius: 8px;
  border-left: 3px solid var(--terra);
}

.expect-list li p {
  font-size: 0.95rem;
  color: var(--obsidian);
  line-height: 1.5;
  font-weight: 400;
}

/* ============ CTA SECTION ============ */
.cta-section {
  background: var(--terra);
  padding: 100px 60px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.cta-section::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

.cta-section h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 900;
  color: var(--cream);
  margin-bottom: 16px;
  position: relative;
}

.cta-section p {
  font-size: 1.05rem;
  color: rgba(250,248,243,0.85);
  max-width: 500px;
  margin: 0 auto 40px;
  line-height: 1.7;
  font-weight: 300;
  position: relative;
}

.cta-actions {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  position: relative;
}

/* ============ BUTTONS ============ */
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--terra);
  color: var(--cream);
  padding: 16px 36px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 700;
  font-size: 0.95rem;
  letter-spacing: 0.03em;
  transition: all 0.3s ease;
  border: 2px solid var(--terra);
}

.btn-primary:hover {
  background: var(--terra-dark);
  border-color: var(--terra-dark);
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(184,92,42,0.25);
}

.btn-cta-light {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--cream);
  color: var(--obsidian);
  padding: 18px 44px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 0.03em;
  transition: all 0.3s ease;
  position: relative;
}

.btn-cta-light:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.25);
}

.btn-cta-outline {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: transparent;
  color: var(--cream);
  padding: 18px 44px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
  font-size: 1rem;
  letter-spacing: 0.03em;
  transition: all 0.3s ease;
  border: 2px solid rgba(250,248,243,0.5);
}

.btn-cta-outline:hover {
  border-color: var(--cream);
  background: rgba(250,248,243,0.1);
}

/* ============ FOOTER ============ */
footer {
  background: var(--obsidian);
  border-top: 1px solid rgba(184,92,42,0.15);
  padding: 60px 60px 40px;
}

.footer-top {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 60px;
  margin-bottom: 60px;
}

.footer-brand {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 900;
  margin-bottom: 16px;
  color: var(--cream);
}

.footer-brand span { color: var(--terra); }

.footer-tagline {
  font-size: 0.88rem;
  color: var(--stone);
  line-height: 1.6;
  max-width: 300px;
}

.footer-col h4 {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--sand);
  margin-bottom: 20px;
}

.footer-col a {
  display: block;
  text-decoration: none;
  color: var(--stone);
  font-size: 0.88rem;
  margin-bottom: 12px;
  transition: color 0.3s ease;
}

.footer-col a:hover { color: var(--terra); }

.footer-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 30px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.footer-copy {
  font-size: 0.78rem;
  color: var(--stone);
  font-family: 'DM Mono', monospace;
}

.footer-socials {
  display: flex;
  gap: 16px;
}

.footer-socials a {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--obsidian-mid);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--sand);
  text-decoration: none;
  font-size: 0.8rem;
  transition: all 0.3s ease;
}

.footer-socials a:hover {
  background: var(--terra);
  color: var(--cream);
}

/* ============ RESPONSIVE ============ */
@media (max-width: 1024px) {
  .topics-grid { grid-template-columns: repeat(2, 1fr); }
  .expect-layout { grid-template-columns: 1fr; gap: 40px; }
  .footer-top { grid-template-columns: 1fr 1fr; gap: 40px; }
}

@media (max-width: 768px) {
  nav { padding: 16px 24px; }
  nav.scrolled { padding: 12px 24px; }
  .nav-links { display: none; }
  .nav-toggle { display: flex; }

  .nav-links.active {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 100%; left: 0; right: 0;
    background: rgba(26,26,24,0.98);
    padding: 24px;
    gap: 20px;
    border-bottom: 1px solid rgba(184,92,42,0.15);
  }

  .page-hero { padding: 120px 24px 70px; }
  section { padding: 70px 24px; }
  .topics-grid { grid-template-columns: 1fr; }
  .cta-section { padding: 80px 24px; }
  .cta-actions { flex-direction: column; align-items: center; }
  footer { padding: 48px 24px 32px; }
  .footer-top { grid-template-columns: 1fr; gap: 32px; }
  .footer-bottom { flex-direction: column; gap: 16px; text-align: center; }
}
</style>
